{% extends "base.html" %}
{% block title %}WOD Library — Row Tracker{% endblock %}

{% block content %}

<div class="page-header">
  <h1>WOD Library</h1>
</div>

{% for section in sections %}
<section class="section">
  <div class="section-header">
    <h2 class="section-title">{{ section.label }}</h2>
  </div>

  <div class="library-grid">
    {% for w in section.wods %}
    <div class="library-card">
      <div class="library-card-header">
        <span class="library-title">{{ w.title }}</span>
        <span class="zone-pill zone-{{ w.zone }}">{{ w.zone }}</span>
      </div>
      <p class="library-coaching">{{ w.coaching }}</p>
      <form method="POST" action="{{ url_for('wod.wod_generate') }}" class="library-assign-form">
        <input type="hidden" name="force_type" value="{{ section.type }}" />
        <button type="submit" class="btn btn-ghost btn-sm">Assign today →</button>
      </form>
    </div>
    {% endfor %}
  </div>
</section>
{% endfor %}

{% endblock %}
