services:
  row-tracker:
    build: .
    container_name: row-tracker
    ports:
      # Localhost only — the app has no built-in login. To reach it from a
      # phone/other device on a network you trust, change this to "7376:7376".
      - "127.0.0.1:7376:7376"
    volumes:
      - ./data:/app/data
      - ./csv-data:/app/csv-data:ro
    env_file:
      - .env
    restart: unless-stopped
